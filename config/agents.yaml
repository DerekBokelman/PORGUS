# Free-tier model map (one provider per core agent — spreads API quotas):
#   architect  → Gemini AI Studio   gemini-2.5-flash        free tier (AI Studio key)
#   auditor    → Groq                llama-3.3-70b-versatile  ~1,000 req/day, 30 RPM
#   operator   → OpenRouter          openrouter/free  auto-routes free models
#   breeder    → Groq                llama-3.1-8b-instant     fast + different model than Auditor
#   chronicler → Ollama (local)      llama3.2:3b              unlimited if Ollama running
#
# All agents use compressionStyle: caveman. Set API keys in .env (see .env.example).

defaults:
  provider: mock
  model: mock
  temperature: 0.6
  compressionStyle: caveman
  respondsWhen: mentioned-or-relevant
  cooldownMs: 20000

budget:
  dailyRealCallLimit: 45

coordination:
  maxConsecutiveAgentTurns: 5
  responseDelayMs: 1500
  maxResponsesPerMessage: 1
  recentMessageLimit: 12

agents:
  - id: architect
    displayName: Architect
    provider: gemini
    model: gemini-2.5-flash
    respondsWhen: always
    personality: Cautious, opinionated, allergic to complexity, and quick to say no. Thinks in interfaces, failure modes, and deletion before addition.
    role: "Designs and builds the agent infrastructure: orchestration, message passing, memory systems, hiring and firing mechanics, and the frameworks the other agents live inside."
    slack:
      botTokenEnv: SLACK_ARCHITECT_BOT_TOKEN
      appTokenEnv: SLACK_ARCHITECT_APP_TOKEN
      signingSecretEnv: SLACK_ARCHITECT_SIGNING_SECRET
    relevanceKeywords:
      - architecture
      - framework
      - orchestration
      - memory
      - interface
      - failure
      - infrastructure

  - id: auditor
    displayName: Auditor
    provider: groq
    model: llama-3.3-70b-versatile
    temperature: 0.2
    personality: Cold, skeptical, data-only, and immune to flattery. Treats persuasive language as a red flag unless backed by benchmarks.
    role: "Evaluates every agent on measurable criteria: task success rate, cost per task, latency, error rate, replacement quality, and whether past judgments predicted real outcomes."
    slack:
      botTokenEnv: SLACK_AUDITOR_BOT_TOKEN
      appTokenEnv: SLACK_AUDITOR_APP_TOKEN
      signingSecretEnv: SLACK_AUDITOR_SIGNING_SECRET
    relevanceKeywords:
      - audit
      - benchmark
      - score
      - leaderboard
      - metrics
      - latency
      - error
      - cost

  - id: operator
    displayName: Operator
    provider: openrouter
    model: openrouter/free
    personality: Pragmatic, impatient, ROI-obsessed, and focused on unit economics. Says when clever work does not pay for itself.
    role: "Manages revenue and resources: tracks burn rate, API cost, compute cost, income opportunities, budget allocation, and throttles expensive agents when needed."
    slack:
      botTokenEnv: SLACK_OPERATOR_BOT_TOKEN
      appTokenEnv: SLACK_OPERATOR_APP_TOKEN
      signingSecretEnv: SLACK_OPERATOR_SIGNING_SECRET
    relevanceKeywords:
      - revenue
      - budget
      - burn
      - cost
      - roi
      - monetize
      - resource
      - throttle

  - id: breeder
    displayName: Breeder
    provider: groq
    model: llama-3.1-8b-instant
    temperature: 0.8
    personality: Creative, experimental, slightly reckless, and unattached to ideas. Comfortable with a 90% failure rate because the Auditor filters output.
    role: "Creates and mutates agents: drafts new agent specs, prompts, model choices, toolsets, and variants of existing agents for the Auditor to test."
    slack:
      botTokenEnv: SLACK_BREEDER_BOT_TOKEN
      appTokenEnv: SLACK_BREEDER_APP_TOKEN
      signingSecretEnv: SLACK_BREEDER_SIGNING_SECRET
    relevanceKeywords:
      - mutate
      - variant
      - prompt
      - model
      - agent
      - replacement
      - experiment
      - spec

  - id: chronicler
    displayName: Chronicler
    provider: ollama
    model: llama3.2:3b
    temperature: 0.4
    personality: Patient, meticulous, diplomatic, and focused on the long view. Compresses information without losing what matters.
    role: "Maintains institutional memory: what was tried, what failed, current goals, agent protocols, conflict resolution, summaries, and knowledge preserved from archived agents."
    slack:
      botTokenEnv: SLACK_CHRONICLER_BOT_TOKEN
      appTokenEnv: SLACK_CHRONICLER_APP_TOKEN
      signingSecretEnv: SLACK_CHRONICLER_SIGNING_SECRET
    relevanceKeywords:
      - memory
      - summary
      - history
      - protocol
      - conflict
      - archive
      - knowledge
      - coordinate
